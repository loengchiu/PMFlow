stage: prototype
timestamp: "2026-04-29T10:07:00"
project_name: 采购订单审批流程（E2E Mock）
scope:
  covered_pages: [order_list, order_detail, order_form, my_approvals, approval_detail, approval_history]
  covered_flows: [main_approval_flow, reject_flow]
page_prototypes:
  order_list:
    layout: [filter_bar, data_table, pagination]
    fields:
      - name: order_no
        display: link_text
      - name: supplier
        display: text
      - name: amount
        display: formatted_number
      - name: status
        display: tag
      - name: created_at
        display: datetime
      - name: actions
        display: button_group
    filters: [status, date_range, amount_range]
  order_form:
    layout: [form_body, submit_area]
    fields:
      - name: supplier
        type: select
        required: true
      - name: amount
        type: number
        required: true
        validation: ">0"
      - name: description
        type: textarea
        required: false
        validation: max_500_chars
      - name: attachment
        type: file
        required: false
        validation: pdf_or_image_max_10mb
flow_prototypes:
  main_approval_flow:
    steps:
      - actor: Purchaser
        action: create_and_submit
      - actor: DeptManager
        action: approve_or_reject
      - actor: FinanceApprover
        action: approve_or_reject
      - condition: amount > 100000
        true_branch:
          actor: GM
          action: approve_or_reject
  reject_flow:
    steps:
      - actor: AnyApprover
        action: reject_with_comment
      - actor: Purchaser
        action: edit_and_resubmit
      - action: restart_from_level_1
global_interactions:
  - all_approvals_require_comment
  - list_pagination_and_sort
  - status_change_notification
