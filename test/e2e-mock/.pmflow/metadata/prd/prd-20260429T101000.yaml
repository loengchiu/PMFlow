acceptance_criteria:
  - id: AC-001
    scenario: 采购专员创建并提交采购订单
    precondition: 已登录为采购专员
    steps: [进入订单列表, 点击新建, 填写必填字段, 点击提交]
    expected: 订单创建成功，状态为PENDING_APPROVAL
  - id: AC-002
    scenario: 部门经理审批通过（≤10万）
    precondition: 订单待部门经理审批
    steps: [进入我的审批, 查看订单详情, 填写意见, 点击通过]
    expected: 订单进入财务审批
  - id: AC-003
    scenario: 财务审批通过（≤10万）
    precondition: 订单待财务审批
    steps: [进入我的审批, 填写意见, 点击通过]
    expected: 订单完成，状态为COMPLETED
  - id: AC-004
    scenario: 财务审批通过（>10万）
    precondition: 订单金额>10万
    steps: [填写意见, 点击通过]
    expected: 进入总经理终审
  - id: AC-005
    scenario: 总经理终审通过
    precondition: 订单待总经理审批
    steps: [填写意见, 点击通过]
    expected: 订单完成
  - id: AC-006
    scenario: 任意节点审批驳回
    precondition: 订单在审批流程中
    steps: [填写驳回意见, 点击驳回]
    expected: 状态REJECTED，可编辑重新提交
  - id: AC-007
    scenario: 驳回后重新提交
    precondition: 订单REJECTED
    steps: [编辑订单, 提交]
    expected: 从一级重新审批
  - id: AC-008
    scenario: 无效金额被阻止
    precondition: 金额≤0
    steps: [填写金额≤0, 点击提交]
    expected: 前端拦截提示
  - id: AC-009
    scenario: 空审批意见被阻止
    precondition: 审批人不填意见
    steps: [不填意见, 点击通过]
    expected: 前端拦截提示
  - id: AC-010
    scenario: 审批记录可追溯
    precondition: 订单已完成多级审批
    steps: [进入审批记录, 筛选订单]
    expected: 显示完整审批时间线
