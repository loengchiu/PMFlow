schema:
  name: pmflow-product-definition
  version: "0.1.0"
  language: zh-CN

product:
  name: PMFlow
  type: ai_ide_skill_workflow
  target_domain: B端中后台需求分析与交付
  primary_user:
    role: PM
    responsibility:
      - 需求访谈
      - 方案对齐
      - 原型评审
      - PRD 归档
      - 研发答疑
  assistant_runtime:
    primary:
      host: Claude Code CLI
      model: DeepSeek V4 PRO
      skill_hosting: ohmyclaude code
    reviewer:
      host: Codex
      role: final_review_and_correction

problem_statement:
  current_pain:
    - 旧 OMP 已能生成完整产物，但质量依赖用户不断发现问题再补规则。
    - 自然语言触发容易误判阶段、误读材料、自动跨阶段。
    - 轻量 skill 表面简洁，但职责混杂，缺少成熟方法论驱动。
    - PRD、原型、方案之间的字段、流程、页面容易脱钩。
    - AI 一次性做完后，PM 没有真正掌握产物，后续评审和答疑仍要重新翻文档。
  desired_outcome:
    - 每个阶段产物都能被 PM 读懂、确认、掌控。
    - AI 在生成前使用明确方法论处理输入。
    - reviewer 独立检查 writer，不做自我复述。
    - 人读产物干净，机读 metadata 可校验。
    - 小改动可以局部修正并同步关联处。

non_goals:
  - 不做全自动 PM 流水线。
  - 不覆盖 API / HLD / LLD / Test Strategy / Test Spec。
  - 不替 PM 做业务范围拍板。
  - 不要求第一版支持所有 IDE。
  - 不继承旧 OMP 的运行时结构。
  - 不恢复 PowerShell 主流程。

core_principles:
  explicit_command_entry:
    requirement: 所有主阶段必须通过显式命令触发。
    command_skill_map:
      - command: /pm-guide
        skill: pm-guide
        mode: route_only
      - command: /pm-brd
        skill: brd-interviewer
        mode: interviewer
      - command: /pm-uc
        skill: uc-interviewer
        mode: interviewer
      - command: /pm-solution
        skill: solution-writer
        mode: writer
      - command: /pm-solution-review
        skill: solution-reviewer
        mode: reviewer
      - command: /pm-proto
        skill: prototype-designer
        mode: writer
      - command: /pm-proto-review
        skill: prototype-reviewer
        mode: reviewer
      - command: /pm-prd
        skill: prd-writer
        mode: writer
      - command: /pm-prd-review
        skill: prd-reviewer
        mode: reviewer
  pm_ownership_gate:
    requirement: 每个阶段完成后必须停下，等待 PM 阅读和确认。
    rules:
      - 阶段通过不等于自动进入下一阶段。
      - PM 未显式确认时不得推进。
      - 下一步只能提示命令，不能代执行。
  writer_reviewer_split:
    requirement: 关键阶段必须拆成 writer 和 reviewer。
    stages:
      - solution
      - prototype
      - prd
  human_machine_separation:
    requirement: 人读产物和机读 metadata 分离。
    human_outputs_root: output/
    machine_outputs_root: .pmflow/
  method_before_generation:
    requirement: 方法论用于生成前推导，不是生成后装饰性检查。
  no_autopilot:
    requirement: PMFlow 是 AI-assisted PM workflow，不是 AI-autopilot workflow。

skill_chain:
  phase_1_minimum_chain:
    - id: pm-guide
      type: router
      purpose: 判断当前项目状态和唯一下一步
      output: next_action_report
    - id: brd-interviewer
      type: interviewer
      purpose: 把模糊需求问成业务需求
      output: brd_note
    - id: uc-interviewer
      type: interviewer
      purpose: 把业务需求问成用户路径和任务流
      output: user_journey_note
    - id: solution-writer
      type: writer
      purpose: 生成当前版本方案
      output: solution_note
      sidecar: solution_metadata
    - id: solution-reviewer
      type: reviewer
      purpose: 审查方案是否足够进入原型或 PRD
      output: solution_review
    - id: prototype-designer
      type: writer
      purpose: 基于方案和任务流生成交付型原型
      output: prototype_files
      sidecar: prototype_metadata
    - id: prototype-reviewer
      type: reviewer
      purpose: 审查原型页面、流程、字段和标注是否可交付
      output: prototype_review
    - id: prd-writer
      type: writer
      purpose: 生成正式归档 PRD
      output: prd_document
      sidecar: prd_metadata
    - id: prd-reviewer
      type: reviewer
      purpose: 审查 PRD 是否可归档、可研发、可测试
      output: prd_review
  phase_2_extensions:
    - id: fix
      purpose: 局部修正并同步关联产物
    - id: change
      purpose: 正式交付后的范围变化判断

stage_contracts:
  brd_interviewer:
    inputs:
      - raw_request
      - background_materials
      - pm_context
    must_distinguish:
      - 原始需求
      - 背景材料
      - 会后回答
    outputs:
      human:
        - output/brd/*.md
      machine:
        - .pmflow/metadata/brd/*.yaml
    gate:
      mode: interviewer_self_check_then_pm_confirmation
      requires_pm_confirmation: true
      reviewer_required: false
      confirmation_meaning: PM 已阅读 brd note，并确认可进入用户路径梳理或继续补问
      next_allowed:
        - /pm-uc
        - /pm-brd
  uc_interviewer:
    inputs:
      - confirmed_brd
      - user_roles
      - scenario_materials
    methods:
      - user_journey
      - task_flow
      - gap_analysis
    outputs:
      human:
        - output/uc/*.md
      machine:
        - .pmflow/metadata/uc/*.yaml
    gate:
      mode: interviewer_self_check_then_pm_confirmation
      requires_pm_confirmation: true
      reviewer_required: false
      confirmation_meaning: PM 已阅读用户路径和任务流，并确认可进入方案阶段或继续补问
      next_allowed:
        - /pm-solution
        - /pm-uc
  solution_writer:
    inputs:
      - confirmed_brd
      - confirmed_user_journey
      - relevant_materials
    methods:
      - as_is_to_be
      - gap_analysis
      - user_task_flow
      - information_architecture
      - lightweight_adr
    required_content:
      - build_type
      - module_scope
      - page_scope
      - key_fields_or_field_groups
      - key_actions
      - module_main_flow
      - page_flow_rules
      - open_questions
    outputs:
      human:
        - output/solution/*.md
      machine:
        - .pmflow/metadata/solution/*.yaml
    gate:
      requires_reviewer: true
      requires_pm_confirmation: true
      reviewer_blocking: true
      pm_override_allowed: false
  solution_reviewer:
    checks:
      - build_type_correctness
      - field_coverage
      - flow_coverage
      - information_architecture_quality
      - no_machine_leakage
      - no_unconfirmed_scope_expansion
    outputs:
      human:
        - output/review/solution-review-*.md
      machine:
        - .pmflow/reviews/solution-review-*.yaml
    gate:
      reviewer_blocking: true
      pm_override_allowed: false
  prototype_designer:
    inputs:
      - confirmed_solution
      - solution_metadata
    methods:
      - user_task_flow
      - information_architecture
      - state_transition
    required_content:
      - page_files
      - shared_css_js_if_needed
      - outline_toggle
      - annotation_markers
      - primary_flow_visible
    outputs:
      human:
        - output/prototype/*
      machine:
        - .pmflow/metadata/prototype/*.yaml
    gate:
      requires_reviewer: true
      requires_pm_confirmation: true
      reviewer_blocking: true
      pm_override_allowed: false
  prototype_reviewer:
    checks:
      - page_scope_matches_solution
      - list_fields_match_user_decision_priority
      - form_fields_visible_or_grouped
      - main_flow_walkable
      - annotations_linkable
      - no_explainer_board_style
    outputs:
      human:
        - output/review/prototype-review-*.md
      machine:
        - .pmflow/reviews/prototype-review-*.yaml
    gate:
      reviewer_blocking: true
      pm_override_allowed: false
  prd_writer:
    inputs:
      - confirmed_solution
      - confirmed_prototype_if_exists
      - metadata
    required_content:
      - background_and_goal
      - scope
      - module_page_action_details
      - business_rules
      - exception_rules
      - permission_rules
      - data_dictionary
      - field_page_relationship
      - data_impact
      - acceptance_criteria
    outputs:
      human:
        - output/prd/*.md
      machine:
        - .pmflow/metadata/prd/*.yaml
    gate:
      requires_reviewer: true
      requires_pm_confirmation: true
      reviewer_blocking: true
      pm_override_allowed: false
  prd_reviewer:
    checks:
      - prd_independent_archive_quality
      - no_push_back_to_prototype
      - field_dictionary_consistency
      - action_rule_exception_permission_coverage
      - acceptance_criteria_quality
    outputs:
      human:
        - output/review/prd-review-*.md
      machine:
        - .pmflow/reviews/prd-review-*.yaml
    gate:
      reviewer_blocking: true
      pm_override_allowed: false

metadata_policy:
  format: yaml
  location: .pmflow/metadata/
  review_location: .pmflow/reviews/
  visible_to_pm_by_default: false
  human_output_forbidden_fields:
    - anchor_id
    - rules_ref
    - prototype_ref
    - machine_profile
    - internal_path
  stable_ids:
    human_visible: page_short_ids_only
    machine_visible: full_stable_ids_allowed

state_model:
  file: .pmflow/status.yaml
  minimum_fields:
    - project_name
    - current_stage
    - artifacts
    - approved_baselines
    - open_questions
    - pm_confirmations
    - review_results
  pm_confirmations:
    required: true
    fields:
      - stage
      - artifact
      - confirmed
      - confirmed_at
      - confirmed_by

quality_methods:
  allowed_primary_methods:
    - as_is_to_be
    - gap_analysis
    - user_journey
    - task_flow
    - information_architecture
    - lightweight_adr
  cautious_methods:
    - five_whys
  excluded_from_main_chain:
    - rice
    - ice
    - moscow
    - okr
    - variance_analysis
    - opportunity_solution_tree

regression_cases:
  - name: 审计系统
    path: D:\work\交投软件中心\审计系统
    must_verify:
      - 旧系统参考但新部署新代码新数据库新实例时判为新建
      - 年度审计计划列表有关键展示字段
      - 年度审计计划表单有字段或字段分组
      - 提交审批有流程口径
      - 小改动不整篇重写
  - name: 公众服务管理
    path: D:\work\交投软件中心\智慧服务区\公众服务管理
    must_verify:
      - 背景材料不被当成会后回答
      - 多轮问题只问差量
      - 阶段确认后才推进
  - name: 智慧服务区资产管理
    path: D:\work\交投软件中心\智慧服务区\物业管理\资产管理
    must_verify:
      - PRD 文风接近已认可版本
      - 原型页面结构清楚
      - 页面和字段说明不脱钩

acceptance_criteria:
  - 新项目第一次启动时不会自动读取项目文件生成产物。
  - 每个阶段完成后都会停下等待 PM 显式确认。
  - reviewer 能发现 writer 漏掉的字段、流程、页面、规则问题。
  - output 中不出现机读字段。
  - metadata 能支持 trace/lint/review。
  - 小改动优先局部 diff。
  - 用户能通过 USER-GUIDE 独立启动 DeepSeek 执行。
  - Codex 能通过 review-manual 验收 DeepSeek 成果。
