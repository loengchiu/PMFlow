# .pmflow/status.yaml 的结构化 schema

schema:
  name: pmflow-status
  version: "1.0.0"

fields:
  project_name:
    type: string
    required: true
    description: 项目名称

  workflow_mode:
    type: enum
    required: true
    values: [new_main]
    description: PMFlow 当前发布版只使用 new_main 主链

  current_stage:
    type: enum
    required: true
    values:
      - uninitialized
      - input
      - align
      - design
      - wireframe
      - prd
      - prototype
    description: 当前阶段。writer 成功后更新，reviewer 不推进阶段。

  artifacts:
    type: object
    required: true
    properties:
      input:
        type: array
        items: string
      align:
        type: array
        items: string
      design:
        type: array
        items: string
      wireframe:
        type: array
        items: string
      prd:
        type: array
        items: string
      prototype:
        type: array
        items: string

  open_questions:
    type: array
    required: true
    items:
      type: object
      required_fields: [id, question, status]
      properties:
        id:
          type: string
        question:
          type: string
        status:
          type: enum
          values: [open, resolved, deferred]
        noted_at:
          type: string
          format: iso8601

  review_results:
    type: array
    required: true
    items:
      type: object
      required_fields:
        - stage
        - check_type
        - verdict
        - checked_at
        - reviewed_artifact
        - reviewed_metadata
      properties:
        stage:
          type: enum
          values: [input, align, design, wireframe, prd, prototype]
        check_type:
          type: enum
          values: [self_check, reviewer_check]
        verdict:
          type: enum
          values: [pass, warn, fail]
        fail_reasons:
          type: array
          items: string
        warnings:
          type: array
          items: string
        checked_at:
          type: string
          format: iso8601
        reviewer:
          type: string
        reviewed_artifact:
          type: string
          description: 被审查的人读产物路径
        reviewed_metadata:
          type: string
          description: 被审查的 metadata 入口路径

  fix_debts:
    type: array
    required: false
    description: pm-fix 记录的复查债务，由 pm-fix-review 收口
    items:
      type: object
      required_fields:
        - debt_id
        - change_level
        - source_stage
        - description
        - changed_files
        - metadata_files
        - snapshot_files
        - sync_status
        - created_at
        - status
      properties:
        debt_id:
          type: string
        change_level:
          type: enum
          values: [L1, L2, L3, L4, L5]
        source_stage:
          type: enum
          values: [input, align, design, wireframe, prd, prototype]
        affected_stages:
          type: array
          items: string
        description:
          type: string
        affected_objects:
          type: array
          items: string
        changed_files:
          type: array
          items: string
        metadata_files:
          type: array
          items: string
        snapshot_files:
          type: array
          items: string
        sync_status:
          type: enum
          values: [synced, partial, pending, blocked]
        needs_stage_review:
          type: array
          items: string
        created_at:
          type: string
          format: iso8601
        status:
          type: enum
          values: [open, closed]
        closed_at:
          type: string
          format: iso8601
        close_reason:
          type: string

  snapshot_records:
    type: array
    required: false
    description: 快照同步记录，用于 pm-fix 的 snapshot diff
    items:
      type: object
      required_fields: [stage, snapshot_path, synced_at]
      properties:
        stage:
          type: enum
          values: [input, align, design, wireframe, prd, prototype]
        snapshot_path:
          type: string
        synced_at:
          type: string
          format: iso8601
        synced_by:
          type: enum
          values: [writer, fix, fix-review, stage-review]
