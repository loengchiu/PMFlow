# 上下文防爆规则
context_control:
  human_read_entry: output/prd/prd.md
  ai_generation: 逐页生成，先数据字典后详细需求
  ai_reading: 先读 metadata index，再按页面读取相关分片
  file_limits:
    index: 200 行
    single_page_metadata: 300 行
    single_entity_metadata: 200 行

# review 标准（pm-prd-reviewer 使用）
review_checklist:
  fail:
    - 归档可读性：需要反复回看 design/wireframe 才能理解
    - 正文写法：大量机械填空或只写泛泛功能
    - 页面覆盖：核心页面缺失
    - 动作覆盖：提交、审批、确认、导入导出等关键动作缺规则
    - 字段一致性：正文字段无字典定义，或字典核心字段无正文落点
    - 规则覆盖：核心规则、权限或验收缺失
    - 来源追溯：出现未确认扩展或来源断裂
    - 人机分离：出现内部路径、metadata 字段、review 字段、trace block
  warn:
    - 归档可读性：个别概念需补充但不影响评审
    - 正文写法：个别动作略空或略模板化
    - 页面覆盖：边缘页面略简
    - 动作覆盖：边缘动作可补充
    - 字段一致性：边缘字段落点可补
    - 规则覆盖：边缘规则待补
    - 来源追溯：个别来源不完整
  pass:
    - 归档可读性：研发只读 PRD 能理解范围、页面、规则、验收
    - 正文写法：页面按目标、功能点、区域职责、动作自然展开
    - 页面覆盖：design 核心页面都有 PRD 章节
    - 动作覆盖：核心动作有触发、结果、状态或异常说明
    - 字段一致性：正文字段与数据字典能双向反查
    - 规则覆盖：业务规则、异常、权限、验收覆盖核心流程
    - 来源追溯：PRD 内容能追溯到 design 或 wireframe
    - 人机分离：人读 PRD 干净

# review 输出必填字段
review_required_fields:
  - stage
  - check_type
  - verdict
  - reviewed_artifact
  - reviewed_metadata
  - checked_at
  - fail_reasons
  - warnings
  - checks_detail
  - reviewer
