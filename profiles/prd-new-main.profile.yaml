# PRD 阶段产物契约（new_main）
# /pm-prd 基于 design + wireframe 生成归档 PRD

profile:
  name: prd-new-main
  version: "0.1.0"
  purpose: 面向研发评审和归档的人读规格文档
  workflow_mode: new_main

stage_contract:
  gate: reviewer_check
  check_type: reviewer_check
  reviewer_required: true
  reviewer_blocking: true
  pm_override_allowed: false
  on_review_fail: PRD 表达问题回到 /pm-prd；design/wireframe 层问题执行 /pm-fix
  on_review_pass: 手动执行 /pm-prototype

# 前置条件
prerequisites:
  workflow_mode: new_main
  current_stage: wireframe 或 prd
  artifacts:
    design: 非空
    wireframe: 非空
  review_results:
    wireframe:
      check_type: reviewer_check
      verdict: [pass, warn]
      binding: reviewed_artifact = artifacts.wireframe 最新, reviewed_metadata = wireframe metadata 最新
  fix_debts:
    open: 不存在

# 人读产物要求（PM 主阅读入口：output/prd/prd.md）
human_output_requirements:
  - 文档概述（项目背景、目标、范围）
  - 范围（范围内模块/页面、范围外内容）
  - 业务流程（主流程步骤）
  - 用户角色与权限（角色定义、权限矩阵）
  - 数据字典（核心实体字段定义）
  - 详细需求说明（按模块→页面→动作展开）
  - 验收标准汇总（可测试、可判断）
  - 风险与待确认

# 按需章节（存在真实约束时出现）
optional_sections:
  - 公共模块说明
  - 系统依赖
  - 非功能要求
  - 数据影响范围
  - 建议实施顺序
  - 附录

# 机读 metadata 要求
machine_output_requirements:
  index:
    source_design_artifact: ""
    source_design_metadata: ""
    source_wireframe_artifact: ""
    source_wireframe_metadata: ""
    pages: []
    rules: []
    acceptance: []

  dictionary: []
