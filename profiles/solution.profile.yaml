# solution-writer 的阶段产物契约
# 定义 solution note 必须包含的字段、方法论要求、门禁条件

profile:
  name: solution
  version: "0.1.0"
  stage: solution
  skill: solution-writer
  gate_mode: reviewer_check_then_pm_confirmation
  reviewer_required: true
  reviewer_blocking: true
  pm_override_allowed: false
  prerequisite_stages:
    - brd: confirmed
    - uc: confirmed

# 输入
inputs:
  - name: confirmed_brd
    source: output/brd/ + .pmflow/metadata/brd/
    required: true
  - name: confirmed_user_journey
    source: output/uc/ + .pmflow/metadata/uc/
    required: true
  - name: relevant_materials
    source: PM 补充
    required: false

# 必须使用的方法论（生成前推导用）
required_methods:
  - as_is_to_be
  - gap_analysis
  - user_task_flow
  - information_architecture
  - lightweight_adr

# 人读产物必须覆盖的内容
human_output_requirements:
  build_type:
    required: true
    description: 建设类型判定（iteration / new_build / hybrid）
    min_quality:
      - 有判定依据（部署、代码、数据库、实例四个维度的新旧判断）
      - hybrid 时标注哪些部分是迭代、哪些是新建
  module_scope:
    required: true
    description: 覆盖的模块范围
  page_scope:
    required: true
    description: 覆盖的页面清单
    min_quality:
      - 区分列表页、表单页、详情页
      - 标注页面之间的关系
  key_fields_or_field_groups:
    required: true
    description: 关键字段或字段组
    min_quality:
      - 列表页标注展示字段（按用户判断优先级排序）
      - 表单页标注填写字段或字段分组
      - 不必穷举所有字段
  key_actions:
    required: true
    description: 关键操作和按钮
    min_quality:
      - 标注操作入口、触发条件、结果
  module_main_flow:
    required: true
    description: 模块主流程
    min_quality:
      - 有入口、提交后、通过后、驳回后的完整口径
  page_flow_rules:
    required: true
    description: 页面流转规则
  open_questions:
    required: true
    description: 待确认问题

# 机读 metadata 必须覆盖的字段
machine_output_requirements:
  - field: build_type_evidence
    description: 建设类型四维度判定依据
  - field: modules
    description: 结构化模块定义
  - field: pages
    description: 结构化页面定义（含类型和关系）
  - field: fields
    description: 结构化字段定义（含页面归属和优先级）
  - field: actions
    description: 结构化操作定义
  - field: flows
    description: 结构化流程定义
  - field: page_flows
    description: 页面流转图
  - field: decisions
    description: 架构决策记录（轻量 ADR）
  - field: source_trace
    description: 每条方案内容的 BRD/UC 来源追溯

# reviewer 检查项
reviewer_checks:
  - id: build_type_correctness
    description: 建设类型判定是否正确
    severity: fail_if_wrong
  - id: field_coverage
    description: 关键字段是否覆盖
    severity: fail_if_missing
  - id: flow_coverage
    description: 主流程和页面流转是否完整
    severity: fail_if_missing
  - id: information_architecture_quality
    description: 列表页信息优先级是否合理
    severity: warn_if_weak
  - id: no_machine_leakage
    description: 人读产物中无 anchor_id/rules_ref/prototype_ref/machine_profile/internal_path
    severity: fail_if_found
  - id: no_unconfirmed_scope_expansion
    description: 未在 BRD/UC 中确认的范围不得擅自扩展
    severity: fail_if_found

# 门禁条件
gate:
  reviewer_blocking: true
  pm_override_allowed: false
  after_review:
    pass: 推荐 /pm-confirm，PM 确认后进入 /pm-proto
    warn: 推荐 /pm-confirm，PM 知情确认后进入 /pm-proto 或回 /pm-solution
    fail: 只能回到 /pm-solution 修正
  pm_confirmation_required: true
  confirmed_stage: solution
