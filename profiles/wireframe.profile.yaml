# wireframe 阶段产物契约
# /pm-wireframe 线框说明稿

profile:
  name: wireframe
  version: "0.2.0"
  purpose: 基于 design 产物生成 Markdown 线框说明稿，验证页面结构、跳转、落点和疑点

stage_contract:
  gate: reviewer_check
  check_type: reviewer_check
  reviewer_required: true
  reviewer_blocking: true
  pm_override_allowed: false
  on_review_fail: 线框表达问题回到 /pm-wireframe；design 层问题执行 /pm-fix
  on_review_pass: 手动执行 /pm-prd

# 人读产物要求（PM 主阅读入口：output/wireframe/wireframe.md）
# 结构对齐 templates/wireframe.md
human_output_requirements:
  - 覆盖范围（来源 design、覆盖模块、覆盖页面、覆盖主流程）
  - 页面跳转树（页面间进入、返回、衔接关系）
  - 主流程说明（按用户动作和页面流转的编号步骤）
  - 页面线框（逐页：页面跳转、页面结构 ASCII 草图、字段/操作/状态落点表、设计疑点）
  - 设计疑点汇总（汇总所有页面层暴露的问题）

# 机读 metadata 要求
# metadata 只做索引，不复制完整线框正文
machine_output_requirements:
  # 索引文件：.pmflow/metadata/wireframe/index.yaml
  index:
    source_design_artifact: ""  # 来源 design 产物路径
    source_design_metadata: ""  # 来源 design metadata 路径
    pages: []
    navigation: []

  # 页面清单
  pages: []
    # - id: WF-PAGE-001
    #   name: 页面名称
    #   type: list | form | detail | dashboard
    #   module: MOD-001
    #   design_page_ref: PAGE-001  # 来源 design 页面 ID
    #   sections:
    #     - name: 区域名称
    #       type: field_group | action_bar | status_display | exception_zone
    #       fields: [FIELD-001, FIELD-002]
    #       operations: [OP-001]

  # 页面间导航
  navigation: []
    # - id: WF-NAV-001
    #   from: WF-PAGE-001
    #   to: WF-PAGE-002
    #   trigger: 操作名称或条件
    #   flow_ref: FLOW-001  # 来源 design 流程 ID

  # 字段布局
  field_layouts: []
    # - id: WF-FL-001
    #   page: WF-PAGE-001
    #   field: FIELD-001
    #   display: edit | view | hidden
    #   group: 分组名称
    #   order: 1
    #   design_field_ref: FIELD-001

  # 操作入口
  operation_entries: []
    # - id: WF-OP-001
    #   page: WF-PAGE-001
    #   name: 操作名称
    #   type: button | link | auto
    #   trigger_condition: 触发条件
    #   target_page: WF-PAGE-002
    #   design_flow_ref: FLOW-001

  # 状态展示区域
  state_zones: []
    # - id: WF-SZ-001
    #   page: WF-PAGE-001
    #   entity: ENTITY-001
    #   states: [STATE-001, STATE-002]
    #   display_position: 页面位置

  # 异常提示
  exception_hints: []
    # - id: WF-EH-001
    #   page: WF-PAGE-001
    #   trigger: 校验失败 | 权限不足 | 网络异常 | 空数据
    #   display: 提示方式
    #   design_rule_ref: RULE-001

  # 设计疑点索引
  design_issues: []
    # - id: WF-ISSUE-001
    #   question: 问题描述
    #   affected_pages: [WF-PAGE-001]
    #   affected_flows: [FLOW-001]
    #   suggestion: 建议处理

# 上下文防爆规则
context_control:
  human_read_entry: output/wireframe/wireframe.md
  ai_generation: 逐页生成，不允许一次性长文生成
  ai_reading: 先读 metadata index，再按页面读取相关分片
  file_limits:
    index: 200 行
    single_page_metadata: 300 行

# review 标准（wireframe-review 使用）
review_checklist:
  fail:
    - 线框说明稿超出 design 确认范围
    - 新增 design 中不存在的页面或模块
    - design 中的核心页面在线框说明稿中缺失
    - 主流程页面间导航断裂（无法从入口走通到终点）
    - 关键操作在线框说明稿中无落点
    - 关键状态无展示区域
  warn:
    - 部分边缘页面的字段布局待细化
    - 部分异常提示位置待补充
    - 非核心页面的导航关系待补充
  pass:
    - design 中所有核心页面在线框说明稿中有落点
    - 主流程页面导航连贯可走通
    - 关键字段、操作、状态均有可见表达
    - 设计疑点已清楚记录
    - 人读产物无机读字段泄漏
    - metadata 符合行数限制

# review 输出必填字段
review_required_fields:
  - stage
  - check_type
  - verdict
  - reviewed_artifact
  - reviewed_metadata
  - checked_at
  - fail_reasons
  - warnings
