# brd-interviewer 的阶段产物契约
# 定义 BRD note 必须包含的字段、自检标准和门禁条件

profile:
  name: brd
  version: "0.1.0"
  stage: brd
  skill: brd-interviewer
  gate_mode: interviewer_self_check_then_pm_confirmation
  reviewer_required: false

# 人读产物必须覆盖的内容
human_output_requirements:
  business_objectives:
    required: true
    description: 可判断的业务目标，不是模糊愿望
    min_quality:
      - 每条目标有可验证的成功标准或至少有方向性描述
      - 不得出现"提升效率""优化体验"等无上下文空洞表述
  stakeholders:
    required: true
    description: 需求方角色及其关注点
    min_quality:
      - 至少包含一个核心需求方角色
      - 每个角色有对应的关注点或诉求
  scope_boundary:
    required: true
    description: 明确什么在范围内、什么不在
  constraints:
    required: false
    description: 已知的技术、组织、时间约束
  input_classification_summary:
    required: true
    description: 四类输入（原始需求/背景材料/会后回答/补充证据）的来源和置信度摘要

# 机读 metadata 必须覆盖的字段
machine_output_requirements:
  - field: source_items
    description: 每条输入材料的分类、来源、置信度
  - field: questions_asked
    description: interviewer 提出的问题列表及回答状态
  - field: business_objectives
    description: 结构化的业务目标列表（含优先级和判断标准）
  - field: stakeholders
    description: 结构化的干系人列表
  - field: scope
    description: 范围边界（in/out）
  - field: open_questions
    description: 未确认项

# 自检标准
self_check_criteria:
  fail:
    - 输入类型混淆：背景材料被当作会后回答回填
    - 未形成可判断的业务目标
    - 关键角色缺失（缺少需求方角色）
    - 当前产出无法支撑进入用户路径梳理
  warn:
    - 存在未确认项，但不影响进入 uc 做初步用户路径草稿
    - 部分角色/场景细节待补充，但主业务目标已清楚
    - 部分材料引用自背景文档，尚未经需求方口头确认
  pass:
    - 业务目标、角色、主约束足够支撑下一阶段（uc）
    - 原始需求、背景材料、会后回答、补充证据已正确区分
    - 未确认项已显式标注在 open_questions 中

# 自检输出格式
self_check_output:
  file_pattern: .pmflow/reviews/brd-self-check-*.yaml
  required_fields:
    - stage
    - check_type
    - verdict
    - fail_reasons
    - warnings
    - open_questions_after_check
    - checked_at
    - reviewed_artifact
    - reviewed_metadata

# 门禁条件
gate:
  after_self_check:
    pass: 等待 PM 确认后推荐 /pm-uc
    warn: 提示 PM 风险，等待 PM 确认后推荐 /pm-uc 或 /pm-brd
    fail: 不得推荐 /pm-uc，只能推荐 /pm-brd 补充，PM 不可跳过
  pm_confirmation_required: true
  confirmed_stage: brd
