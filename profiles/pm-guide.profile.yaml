# pm-guide 阶段流转契约

profile:
  name: pm-guide
  version: "1.0.0"
  purpose: 阶段导航和唯一下一步判断

stage_sequence:
  - uninitialized
  - input
  - align
  - design
  - wireframe
  - prd
  - prototype

stage_gate_types:
  uninitialized:
    gate: none
    next: /pm-input

  input:
    gate: self_check
    on_missing_artifact: /pm-input
    on_missing_check: /pm-input
    on_fail: /pm-input
    on_pass_or_warn: /pm-align

  align:
    gate: reviewer_check
    on_missing_artifact: /pm-align
    on_missing_check: /pm-align-review
    on_fail: /pm-align
    on_pass_or_warn: /pm-design

  design:
    gate: reviewer_check
    on_missing_artifact: /pm-design
    on_missing_check: /pm-design-review
    on_fail: /pm-design
    on_pass_or_warn: /pm-wireframe

  wireframe:
    gate: reviewer_check
    on_missing_artifact: /pm-wireframe
    on_missing_check: /pm-wireframe-review
    on_fail: /pm-wireframe
    on_pass_or_warn: /pm-prd

  prd:
    gate: reviewer_check
    on_missing_artifact: /pm-prd
    on_missing_check: /pm-prd-review
    on_fail: /pm-prd
    on_pass_or_warn: /pm-prototype

  prototype:
    gate: reviewer_check
    on_missing_artifact: /pm-prototype
    on_missing_check: /pm-prototype-review
    on_fail: /pm-prototype
    on_pass_or_warn: 主链路完成

required_status_fields:
  - project_name
  - workflow_mode
  - current_stage
  - artifacts
  - open_questions
  - review_results

decision_priority:
  0: fix_debts 中的 open 债务
  1: review_results 中的 fail 阻断
  2: artifacts 中的空产出
  3: review_results 缺失
  4: review pass/warn

forbidden_skips:
  - uninitialized -> align
  - input 未通过 -> design
  - align review fail 或未审查 -> design
  - design review fail 或未审查 -> wireframe
  - wireframe review fail 或未审查 -> prd
  - prd review fail 或未审查 -> prototype
