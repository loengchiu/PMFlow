# prd-reviewer 的审查契约
# 定义 PRD review 的检查项、阻断规则和输出格式

profile:
  name: prd-review
  version: "0.1.0"
  stage: prd
  skill: prd-reviewer
  type: reviewer
  reviewer_blocking: true
  pm_override_allowed: false
  reviews_stage: prd
  terminal_stage: true

# reviewer 独立检查项（逐项执行）
checks:
  - id: prd_independent_archive_quality
    label: PRD 独立归档质量
    method: 检查 PRD 是否可作为独立文档归档——不依赖阅读 BRD/UC/solution/prototype 即可完整理解需求
    verdict:
      pass: PRD 内容自包含，阅读者无需查阅前置产物即可理解全部需求
      warn: 基本自包含但个别概念需参考前置文档
      fail: PRD 大量引用前置产物且未在本体展开说明，无法独立阅读
    blocking: true

  - id: no_push_back_to_prototype
    label: 无回退到原型阶段的内容
    method: 检查 PRD 是否包含应属于 prototype 阶段的界面描述、交互细节、页面布局说明
    verdict:
      pass: 未发现原型阶段内容
      warn: 存在少量交互说明但不影响 PRD 定位
      fail: 大面积出现界面描述、交互细节等原型阶段内容
    blocking: true

  - id: field_dictionary_consistency
    label: 数据字典与字段一致性
    method: 对照 prototype 和 solution 中的字段定义，检查 PRD 数据字典是否与各页面字段清单一致
    verdict:
      pass: 数据字典字段与各页面字段清单完全一致，无遗漏、无矛盾
      warn: 基本一致但个别字段细节可对齐
      fail: 数据字典与页面字段存在矛盾或遗漏核心字段
    blocking: true

  - id: action_rule_exception_permission_coverage
    label: 操作/规则/异常/权限覆盖
    method: 检查 PRD 的业务规则、异常规则、权限规则是否完整覆盖了 solution 和 prototype 中定义的操作和流程
    verdict:
      pass: 业务规则、异常处理、权限矩阵完整覆盖所有关键操作和流程
      warn: 主流程覆盖完整但部分边缘规则待补充
      fail: 缺少核心业务规则或权限矩阵
    blocking: true

  - id: acceptance_criteria_quality
    label: 验收标准质量
    method: 检查验收标准是否可测试、可判断，是否覆盖正常路径和关键异常路径
    verdict:
      pass: 每条验收标准可独立测试，覆盖正常路径和关键异常路径
      warn: 验收标准基本可测但部分边界条件未覆盖
      fail: 验收标准模糊、不可测，或遗漏关键场景
    blocking: true

  - id: no_machine_leakage
    label: 机读字段无泄漏
    method: 在人读产物中搜索 forbidden_fields（anchor_id, rules_ref, prototype_ref, machine_profile, internal_path, prd_ref）
    verdict:
      pass: 未发现任何禁止字段
      warn: N/A（此检查为二元判定，存在即 fail，无 warn 状态）
      fail: 发现禁止字段
    blocking: true

  - id: source_trace_completeness
    label: 来源追溯完整
    method: 检查 PRD 内容的 source_trace 是否覆盖了 BRD、UC、solution、prototype 四个前置阶段的已确认基线
    verdict:
      pass: 所有 PRD 内容均可追溯到至少一个已确认前置基线
      warn: 大部分可追溯但个别内容来源标注不完整
      fail: source_trace 缺失、未覆盖 brd/uc/solution/prototype、或大量 PRD 内容无法追溯
    blocking: true

# 输出
outputs:
  human:
    path_pattern: output/review/prd-review-*.md
    required_sections:
      - 检查摘要（逐项 verdict）
      - fail 项详情（具体问题、位置、修正建议）
      - warn 项说明（风险点）
      - 整体 verdict
      - 下一步建议（pass/warn→/pm-confirm, fail→/pm-prd）
  machine:
    path_pattern: .pmflow/reviews/prd-review-*.yaml
    required_fields:
      - stage
      - check_type
      - verdict
      - reviewed_artifact
      - reviewed_metadata
      - checks_detail（逐项 verdict、问题描述、修正建议）
      - fail_reasons
      - warnings
      - checked_at
      - reviewer

# reviewer 行为约束
reviewer_constraints:
  must:
    - 独立读取 writer 产出的人读和机读文件
    - 对照已确认 prototype note + metadata 及各前置基线逐项检查
    - 给出独立判定
    - fail 时给出具体修正建议
  must_not:
    - 复述 writer 的判断或措辞
    - 在未逐项检查的情况下给 pass
    - 用"整体完整，可以进入下一步"替代逐项判定
    - 在 fail 时提示 /pm-confirm 或任何后续命令
    - 在 pass/warn 时提示 /pm-prd 或任何后续阶段命令（只提示 /pm-confirm）
