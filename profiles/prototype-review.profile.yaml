# prototype-reviewer 的审查契约
# 定义 prototype review 的检查项、阻断规则和输出格式

profile:
  name: prototype-review
  version: "0.1.0"
  stage: prototype
  skill: prototype-reviewer
  type: reviewer
  reviewer_blocking: true
  pm_override_allowed: false
  reviews_stage: prototype

# reviewer 独立检查项（逐项执行）
checks:
  - id: ia_fidelity
    label: 信息架构忠实度
    method: 对照 solution 的字段优先级和分组，检查原型是否忠实呈现
    verdict:
      pass: 列表字段优先级、表单分组、详情分区与 solution 一致
      warn: 基本一致但个别页面优先级可调整
      fail: 字段优先级或分组与 solution 显著不一致
    blocking: true

  - id: flow_walkability
    label: 流程可走通性
    method: 逐条检查原型中的主流程是否可以逐页走通（入口→中间页→终点）
    verdict:
      pass: 所有主流程可逐页走通，分支条件清晰，角色交接点标注清楚
      warn: 主流程可走通但部分分支条件不够具体
      fail: 主流程存在断点或无法从入口走到终点
    blocking: true

  - id: field_action_consistency
    label: 字段与操作一致性
    method: 对照 solution 的字段和操作定义，检查原型中的字段和操作是否一致
    verdict:
      pass: 字段列表和关键操作与 solution 一致，无缺失、无擅自增删
      warn: 基本一致但个别字段/操作细节有偏差
      fail: 核心字段或关键操作缺失，或擅自增加 solution 中不存在的字段/操作
    blocking: true

  - id: interaction_completeness
    label: 交互状态覆盖
    method: 检查原型是否覆盖了关键交互状态
    verdict:
      pass: 空态、加载态、错误态、成功态均已覆盖
      warn: 覆盖了主要状态但部分边缘状态未描述
      fail: 缺少关键状态描述（如列表空态、表单校验失败态）
    blocking: false

  - id: no_machine_leakage
    label: 机读字段无泄漏
    method: 在人读产物中搜索 forbidden_fields（anchor_id, rules_ref, prototype_ref, machine_profile, internal_path, prd_ref）
    verdict:
      pass: 未发现任何禁止字段
      warn: N/A（此检查为二元判定，存在即 fail，无 warn 状态）
      fail: 发现禁止字段
    blocking: true

  - id: no_unconfirmed_scope_expansion
    label: 无未确认范围扩展
    method: 对比原型中的页面和流程是否超出 solution 已确认的 page_scope 和 module_scope
    verdict:
      pass: 范围在 solution 边界内，或扩展项已标注为 open_question
      warn: 存在合理扩展但未充分说明
      fail: 显著超出 solution 边界且未标注、未确认
    blocking: true

# 输出
outputs:
  human:
    path_pattern: output/review/prototype-review-*.md
    required_sections:
      - 检查摘要（逐项 verdict）
      - fail 项详情（具体问题、位置、修正建议）
      - warn 项说明（风险点）
      - 整体 verdict
      - 下一步建议（pass/warn→/pm-confirm, fail→/pm-proto）
  machine:
    path_pattern: .pmflow/reviews/prototype-review-*.yaml
    required_fields:
      - stage
      - check_type
      - verdict
      - reviewed_artifact
      - reviewed_metadata
      - checks_detail（逐项 verdict、问题描述、修正建议）
      - fail_reasons
      - warnings
      - checked_at
      - reviewer

# reviewer 行为约束
reviewer_constraints:
  must:
    - 独立读取 designer 产出的人读和机读文件
    - 逐项对照本 profile 的 checks 执行检查
    - 给出独立判定
    - fail 时给出具体修正建议
  must_not:
    - 复述 designer 的判断或措辞
    - 在未逐项检查的情况下给 pass
    - 用"整体完整，可以进入下一步"替代逐项判定
    - 在 fail 时提示 /pm-confirm 或 /pm-prd
    - 在 pass/warn 时提示 /pm-prd（只提示 /pm-confirm）
