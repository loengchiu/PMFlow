# prototype-designer 的阶段产物契约
# 定义 prototype note 必须包含的字段、方法论要求、门禁条件

profile:
  name: prototype
  version: "0.1.0"
  stage: prototype
  skill: prototype-designer
  gate_mode: reviewer_check_then_pm_confirmation
  reviewer_required: true
  reviewer_blocking: true
  pm_override_allowed: false
  prerequisite_stages:
    - brd: confirmed
    - uc: confirmed
    - solution: confirmed
      # solution 的确认基线绑定要求（prototype-designer 和 prototype-reviewer 共用前置校验）：
      # 1. pm_confirmations 中 solution confirmed: true
      # 2. solution 确认记录 artifact 等于 artifacts.solution 最新产物
      # 3. approved_baselines 中 solution artifact_path 等于 artifacts.solution 最新产物
      # 4. review_results 中 solution review 非 fail，且 reviewed_artifact 等于最新 solution 产物
      # 5. review_results 中 solution review 的 reviewed_metadata 等于最新 solution metadata

# 输入
inputs:
  - name: confirmed_solution
    source: output/solution/ + .pmflow/metadata/solution/
    required: true
    baseline_binding: 使用 pm_confirmations / approved_baselines 中绑定的 artifact 路径，而非仅取最新文件
  - name: relevant_materials
    source: PM 补充（设计规范、现有系统截图、交互参考等）
    required: false

# 必须使用的方法论（生成前推导用）
required_methods:
  - information_architecture
  - wireframe_description
  - flow_walkthrough
  - state_coverage

# 人读产物必须覆盖的内容
human_output_requirements:
  prototype_scope:
    required: true
    description: 原型覆盖的页面和流程范围
    min_quality:
      - 明确哪些页面/流程有原型、哪些没有
      - 范围与 solution 的 page_scope 一致
  page_prototypes:
    required: true
    description: 逐页原型描述
    min_quality:
      - 列表页：字段按 P0/P1/P2 优先级排列，标注筛选区、操作区位置
      - 表单页：字段按分组排列，标注分组标题和折叠逻辑
      - 详情页：信息按分区排列，标注分区标题和展示格式
      - 每个页面标注关键操作按钮及其位置（顶部/行内/底部）
  flow_prototypes:
    required: true
    description: 主流程可走通的原型描述
    min_quality:
      - 覆盖 solution 中所有 module_main_flow
      - 每条流程可逐页走通（入口→中间页→终点）
      - 标注分支条件和角色交接点
  interaction_states:
    required: true
    description: 关键交互状态覆盖
    min_quality:
      - 列表空态、加载态、错误态
      - 表单默认态、校验失败态、提交成功态
      - 审批通过/驳回后的状态变化
  open_questions:
    required: true
    description: 原型阶段发现的待确认问题

# 机读 metadata 必须覆盖的字段
machine_output_requirements:
  - field: pages_prototyped
    description: 结构化页面原型定义（含布局、字段、操作）
  - field: flows_prototyped
    description: 结构化流程原型定义（含页面序列、分支、角色交接）
  - field: interactions
    description: 结构化交互状态定义（含空态、加载态、错误态、成功态）
  - field: source_trace
    description: 每条原型内容的 solution 来源追溯

# reviewer 检查项
reviewer_checks:
  - id: ia_fidelity
    description: 原型信息架构是否忠实于 solution 的字段优先级和分组
    severity: fail_if_mismatch
  - id: flow_walkability
    description: 主流程是否可以逐页走通
    severity: fail_if_broken
  - id: field_action_consistency
    description: 字段和操作是否与 solution 定义一致
    severity: fail_if_missing
  - id: interaction_completeness
    description: 关键交互状态是否覆盖（空态/加载/错误/成功）
    severity: warn_if_weak
  - id: no_machine_leakage
    description: 人读产物中无 anchor_id/rules_ref/prototype_ref/machine_profile/internal_path/prd_ref
    severity: fail_if_found
  - id: no_unconfirmed_scope_expansion
    description: 原型范围不得超出 solution 已确认的 page_scope
    severity: fail_if_found

# 门禁条件
gate:
  reviewer_blocking: true
  pm_override_allowed: false
  after_review:
    pass: 推荐 /pm-confirm，PM 确认后进入 /pm-prd
    warn: 推荐 /pm-confirm，PM 知情确认后进入 /pm-prd 或回 /pm-proto
    fail: 只能回到 /pm-proto 修正
  pm_confirmation_required: true
  confirmed_stage: prototype
